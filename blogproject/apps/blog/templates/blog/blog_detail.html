{% extends 'blog/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>{{ post.title }}</h2>
    {% if post.image %}
        <img src="{{ post.image.url }}" class="img-fluid mb-3" alt="{{ post.title }}">
    {% endif %}
    <p>{{ post.content }}</p>
    <p><strong>Author:</strong> {{ post.author_id }}</p>
    <h1>{{post}}</h1>
    {% if request.user == post.author %}
        <a href="{% url 'edit_post' post.slug %}" class="btn btn-warning">Edit</a>
        <a href="{% url 'delete_post' post.slug %}" class="btn btn-danger">Delete</a>
    {% endif %}
</div>
{% endblock %}
